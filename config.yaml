name: Inventory
version: "1.0.4"
slug: inventory
description: Self-hosted inventory for electronics parts, tools and workshop supplies.
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
timeout: 30

# Serve the web UI through the Home Assistant sidebar. Ingress removes the need
# to expose a port or manage a separate login.
ingress: true
ingress_port: 3000
# Stream request bodies so large photo/document uploads are not buffered by the
# Supervisor before they reach the app.
ingress_stream: true
panel_icon: mdi:package-variant-closed
panel_title: Inventory

# Optional direct access for API clients and tools that cannot use ingress.
# Off by default; enable it on the add-on page and set an API key.
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Direct web and API access (optional)

# /api/v1/health is exempt from API-key authentication so the watchdog works.
watchdog: http://[HOST]:[PORT:3000]/api/v1/health

# Stop the app while Home Assistant snapshots /data so SQLite is copied safely.
backup: cold

environment:
  DATA_DIR: /data
  PORT: "3000"

options:
  api_key: ""
  default_currency: GBP
  enable_pricing: true
  max_upload_mb: 50
  public_url: ""
schema:
  api_key: password
  default_currency: str(3,3)
  enable_pricing: bool
  max_upload_mb: int(1,2048)
  public_url: str?
